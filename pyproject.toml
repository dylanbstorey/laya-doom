[project]
name = "laya-doom"
version = "0.1.0"
description = "LAYA, an open-weights System 1 decision model, plays Doom in a real-time loop"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya>=0.3.6",
    "vizdoom>=1.3.1",
    "torch>=2.4",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11.0",
    "httpx>=0.28",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
